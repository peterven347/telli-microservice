services:
   gateway:
      env_file:
         - .env
      build:
         context: .
         dockerfile: apps/gateway/Dockerfile
      # ports:
      #    - "3000:3000"
      # environment:
         # KAFKA_BROKER: kafka:9092
         # MONGODB_URI: mongodb://mongo:27017/app
      depends_on:
         kafka:
            condition: service_started
         redis:
            condition: service_started
         cassandra:
            condition: service_healthy
      restart: always
      # extra_hosts:
      #    - "host.docker.internal:host-gateway"
      develop:
         watch:
            - action: sync
              path: apps/gateway/src
              target: apps/gateway/src
              ignore:
                 - node_modules/
                 - dist/

   chat:
      env_file:
         - .env
      ports:
       - "3001:3001"
      build:
         context: .
         dockerfile: apps/chat/Dockerfile
      depends_on:
         kafka:
            condition: service_started
         redis:
            condition: service_started
         cassandra:
            condition: service_healthy
      restart: always

   post:
      env_file:
         - .env
      ports:
       - "3003:3003"
      build:
         context: .
         dockerfile: apps/post/Dockerfile
      restart: always

   livestream:
      env_file:
         - .env
      ports:
       - "3002:3002"
      build:
         context: .
         dockerfile: apps/livestream/Dockerfile
      restart: always

   user:
      env_file:
         - .env
      ports:
       - "3004:3004"
      build:
         context: .
         dockerfile: apps/user/Dockerfile
      restart: always

   cassandra:
      image: cassandra
      ports:
         - "9042:9042"
      volumes:
         - cassandra_data:/var/lib/cassandra
      restart: always
      healthcheck:
         test: ["CMD-SHELL", "cqlsh localhost 9042 -e 'describe keyspaces'"]
         interval: 20s
         timeout: 10s
         retries: 10

   kafka:
      image: apache/kafka:latest
      env_file:
         - .env
      ports:
         - "9092:9092"
      environment:
         KAFKA_NODE_ID: 1
         KAFKA_PROCESS_ROLES: broker,controller

         # KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
         KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

         # KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
         KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

         KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
         # KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
         KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
         KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

         KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

         KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
         KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
         KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

         KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
         KAFKA_NUM_PARTITIONS: 3

         KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      volumes:
         - kafka_data:/var/lib/kafka/data
      restart: always
      healthcheck:
         test:
            [
               "CMD-SHELL",
               "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1",
            ]
         interval: 10s
         timeout: 5s
         retries: 6

   # mongo:
   #    image: mongo
   #    ports:
   #       - "27017:27017"
   #    volumes:
   #       - mongo_data:/data/db
   #    healthcheck:
   #       test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
   #       interval: 10s
   #       timeout: 5s
   #       retries: 5
      # restart: always

   redis:
      env_file:
         - .env
      image: redis:7-alpine
      ports:
         - "6379:6379"
      volumes:
         - redis_data:/data
      restart: always


   mediamtx:
      image: bluenviron/mediamtx:latest
      # image: bluenviron/mediamtx:latest-ffmpeg
      network_mode: host
      restart: unless-stopped
      volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

volumes:
   kafka_data:
   redis_data:
   # mongo_data:
   cassandra_data:
